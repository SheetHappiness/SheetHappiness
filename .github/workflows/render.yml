name: Render softsock OS
on:
  push:
    paths:
      - 'scripts/build.mjs'
      - 'config/desktop.json'
      - '.github/workflows/render.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate profile
        run: node scripts/build.mjs
      - name: Commit generated files when changed
        run: |
          git add README.md assets/desktop.svg assets/screens/ assets/launchers/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(profile): render softsock OS"
            git push
          fi
